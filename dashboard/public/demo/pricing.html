<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing — Kettle & Co.</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Georgia,serif;color:#2b2118;background:#fbf7f0}
    nav{display:flex;justify-content:space-between;align-items:center;padding:20px 48px;border-bottom:1px solid #e6dccb}
    nav a{margin-left:24px;color:inherit;text-decoration:none}
    .logo{font-weight:bold;font-size:22px}
    h1{text-align:center;font-size:44px;margin:64px 0 8px}
    .sub{text-align:center;margin-bottom:48px}
    .plans{display:flex;gap:24px;justify-content:center;padding:0 48px 80px;flex-wrap:wrap}
    .plan{width:300px;background:#fff;border:1px solid #e6dccb;border-radius:8px;padding:28px}
    .plan .price{font-size:40px;margin:12px 0}
    .btn{display:block;text-align:center;padding:14px;background:#2b2118;color:#fff;border:0;border-radius:4px;font-size:16px;cursor:pointer;text-decoration:none;width:100%}
  </style>
  <script src="/tracker.js" defer></script>
</head>
<body>
  <nav>
    <span class="logo">Kettle & Co.</span>
    <div><a href="/demo/index.html">Shop</a><a href="/demo/pricing.html">Pricing</a></div>
  </nav>
  <h1>Tea club pricing</h1>
  <p class="sub">A box every month. Skip or cancel any time.</p>
  <section class="plans">
    <div class="plan"><h3>Sipper</h3><div class="price">$12</div><p>2 teas, 50g each</p><button class="btn">Join Sipper</button></div>
    <div class="plan"><h3>Enthusiast</h3><div class="price">$24</div><p>4 teas + brewing notes</p><button class="btn">Join Enthusiast</button></div>
    <div class="plan"><h3>Connoisseur</h3><div class="price">$48</div><p>6 rare teas + a free kettle</p><button class="btn">Join Connoisseur</button></div>
  </section>
</body>
</html>
